<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免費 WhatsApp 短連結生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #25D366, #128C7E);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #128C7E;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #25D366;
        }
        
        textarea {
            height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .generate-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #25D366;
            text-align: left;
            display: none;
        }
        
        .short-link {
            color: #128C7E;
            font-weight: bold;
            word-break: break-all;
            margin: 10px 0;
            font-size: 16px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        
        .copy-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
            width: 100%;
        }

        .loading {
            color: #128C7E;
            font-style: italic;
        }

        .success {
            color: #25D366;
            font-weight: bold;
        }

        .error {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>免費 WhatsApp 短連結生成器</h1>
        <p class="subtitle">輸入號碼和訊息，自動生成短連結</p>
        
        <div class="input-group">
            <label for="phone">電話號碼（含國碼）</label>
            <input type="text" id="phone" placeholder="例如：85291234567" value="85291234567">
        </div>
        
        <div class="input-group">
            <label for="message">預設訊息（支援中英文和 Emoji）</label>
            <textarea id="message" placeholder="例如：你好！👋 我想查詢更多資料...">你好！👋 我想查詢更多資料...</textarea>
        </div>
        
        <button class="generate-btn" id="generateBtn" onclick="generateShortLink()">🎯 自動生成短連結</button>
        
        <div class="result" id="result">
            <div id="statusMessage"></div>
            <strong>✅ 您的短連結：</strong>
            <div class="short-link" id="shortLink"></div>
            <button class="copy-btn" onclick="copyToClipboard()">📋 複製短連結</button>
        </div>
    </div>

    <script>
        async function generateShortLink() {
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();
            const generateBtn = document.getElementById('generateBtn');
            const resultDiv = document.getElementById('result');
            const statusMessage = document.getElementById('statusMessage');
            
            if (!phone) {
                alert('請輸入電話號碼');
                return;
            }
            
            if (!message) {
                alert('請輸入訊息內容');
                return;
            }
            
            // 禁用按鈕，顯示載入中
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ 生成中...';
            resultDiv.style.display = 'block';
            statusMessage.innerHTML = '<div class="loading">正在自動生成短連結，請稍候...</div>';
            document.getElementById('shortLink').textContent = '生成中...';
            
            try {
                // 編碼訊息
                const encodedMessage = encodeURIComponent(message);
                
                // 生成 WhatsApp 連結
                const whatsappLink = `https://wa.me/${phone}?text=${encodedMessage}`;
                
                // 使用可工作的短連結服務
                const shortLink = await generateTinyUrl(whatsappLink);
                
                // 顯示結果
                document.getElementById('shortLink').textContent = shortLink;
                statusMessage.innerHTML = '<div class="success">✅ 短連結自動生成成功！</div>';
                window.currentLink = shortLink;
                
            } catch (error) {
                console.error('Error:', error);
                // 如果自動生成失敗，提供替代方案
                const encodedMessage = encodeURIComponent(message);
                const whatsappLink = `https://wa.me/${phone}?text=${encodedMessage}`;
                
                document.getElementById('shortLink').textContent = whatsappLink;
                statusMessage.innerHTML = '<div class="error">⚠️ 自動生成失敗，請手動到 https://tinyurl.com 縮短此連結</div>';
                window.currentLink = whatsappLink;
            } finally {
                // 重新啟用按鈕
                generateBtn.disabled = false;
                generateBtn.textContent = '🎯 自動生成短連結';
            }
        }
        
        // 使用可繞過 CORS 的短連結服務
        async function generateTinyUrl(longUrl) {
            // 方法1: 使用 CORS 代理服務
            try {
                const proxyUrl = 'https://api.codetabs.com/v1/proxy?quest=';
                const tinyUrl = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`;
                
                const response = await fetch(proxyUrl + tinyUrl);
                if (response.ok) {
                    const shortUrl = await response.text();
                    if (shortUrl && shortUrl.startsWith('http')) {
                        return shortUrl;
                    }
                }
            } catch (error) {
                console.log('Method 1 failed');
            }
            
            // 方法2: 使用另一個代理
            try {
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent('https://tinyurl.com/api-create.php?url=' + longUrl)}`);
                if (response.ok) {
                    const shortUrl = await response.text();
                    if (shortUrl && shortUrl.startsWith('http')) {
                        return shortUrl;
                    }
                }
            } catch (error) {
                console.log('Method 2 failed');
            }
            
            // 方法3: 使用無 CORS 限制的服務
            try {
                const response = await fetch('https://csclub.uwaterloo.ca/~phthakka/1pt/addURL.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: longUrl
                    })
                });
                const data = await response.json();
                if (data.short) {
                    return `https://1pt.co/${data.short}`;
                }
            } catch (error) {
                console.log('Method 3 failed');
            }
            
            throw new Error('All auto-generation methods failed');
        }
        
        function copyToClipboard() {
            if (!window.currentLink) {
                alert('請先生成連結');
                return;
            }
            
            navigator.clipboard.writeText(window.currentLink).then(() => {
                alert('✅ 短連結已複製到剪貼簿！');
            }).catch(() => {
                const tempInput = document.createElement('input');
                tempInput.value = window.currentLink;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                alert('✅ 短連結已複製到剪貼簿！');
            });
        }
        
        // 頁面加載時自動生成範例
        window.onload = function() {
            generateShortLink();
        };
    </script>
</body>
</html>
